name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Если в ту же ветку пришёл новый push, старую проверку отменяем (только для PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Получение кода
        uses: actions/checkout@v7

      - name: Установка JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Настройка Gradle
        uses: gradle/actions/setup-gradle@v6

      # Если репозиторий создавали на Windows, у gradlew может не быть права на запуск
      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Unit-тесты
        run: ./gradlew testDebugUnitTest

      - name: Сборка debug APK
        run: ./gradlew assembleDebug

      - name: Сохранение APK
        uses: actions/upload-artifact@v7
        with:
          name: bookio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
